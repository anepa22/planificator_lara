# =============================================================================
# Planificator Lara (TBD) — Promote artefacto → test | prod
# =============================================================================
#
# No hay merge a ramas de ambiente. Promovés el SHA validado:
#   Actions → "Lara Promote" → Run workflow
#     sha: <commit>
#     environment: test | prod
#
# API: rebuild/push :sha-<commit> desde el fuente del SHA (así no falta imagen
#      si el commit solo tocó frontend)
# Web: rebuild con VITE_BASE del destino → tag :sha-<commit>-test|prod
# Versión UI: vX.Y.Z (sha7). En prod se hace bump patch + tag git vX.Y.Z
#
# URLs:
#   test → https://anepacloud.ddns.net/test/planificator-lara
#   prod → https://lenceria-lara.ddns.net/  (cutover A: host oficial)
#
# Cutover prod (antes del Promote a prod, si el stack viejo sigue up):
#   kubectl -n prod scale deploy/planificator-web --replicas=0
#   kubectl -n prod scale deploy/planificator-api --replicas=0
#
# Secrets: ANEPAVPS_HOST, ANEPAVPS_USER, ANEPAVPS_SSH_KEY, GHCR_PAT
# Tip: Environments → "prod" → Required reviewers
# =============================================================================

name: Lara Promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA ya deployado en dev (solo el hash; tolera 'SHA-1:' o 'sha-')"
        required: true
        type: string
      environment:
        description: "Ambiente destino"
        required: true
        type: choice
        options:
          - test
          - prod

env:
  API_IMAGE: ghcr.io/anepa22/planificator-api-lara
  WEB_IMAGE: ghcr.io/anepa22/planificator-web-lara
  TAG_PREFIX: sha

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.version.outputs.sha_short }}
      app_version: ${{ steps.version.outputs.app_version }}
      namespace: ${{ steps.env.outputs.namespace }}
      env_name: ${{ steps.env.outputs.env_name }}
      vite_base: ${{ steps.env.outputs.vite_base }}
      vite_api_url: ${{ steps.env.outputs.vite_api_url }}
      vite_app_env: ${{ steps.env.outputs.vite_app_env }}
    steps:
      - name: Check secrets
        env:
          ANEPAVPS_HOST: ${{ secrets.ANEPAVPS_HOST }}
          ANEPAVPS_USER: ${{ secrets.ANEPAVPS_USER }}
          ANEPAVPS_SSH_KEY: ${{ secrets.ANEPAVPS_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          for name in ANEPAVPS_HOST ANEPAVPS_USER ANEPAVPS_SSH_KEY GHCR_PAT; do
            eval "v=\$$name"
            [ -n "$v" ] || { echo "::error::$name empty"; exit 1; }
          done

      - name: Map environment
        id: env
        run: |
          case "${{ inputs.environment }}" in
            test)
              echo "namespace=test" >> "$GITHUB_OUTPUT"
              echo "env_name=test" >> "$GITHUB_OUTPUT"
              echo "vite_base=/test/planificator-lara/" >> "$GITHUB_OUTPUT"
              echo "vite_api_url=/test/planificator-lara" >> "$GITHUB_OUTPUT"
              echo "vite_app_env=test" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              # Cutover A: mismo host oficial que el stack viejo (sin subpath)
              echo "namespace=prod" >> "$GITHUB_OUTPUT"
              echo "env_name=prod" >> "$GITHUB_OUTPUT"
              echo "vite_base=/" >> "$GITHUB_OUTPUT"
              echo "vite_api_url=" >> "$GITHUB_OUTPUT"
              echo "vite_app_env=prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported environment"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve full commit SHA
        id: resolve
        run: |
          raw="${{ inputs.sha }}"
          # Acepta pegados tipo "SHA-1: <hash>" o "sha-<hash>": deja solo el hash
          raw=$(printf '%s' "$raw" | tr -d '[:space:]')
          raw="${raw#SHA-1:}"
          raw="${raw#sha-1:}"
          raw="${raw#sha-}"
          full=$(git rev-parse --verify "${raw}^{commit}")
          echo "sha=${full}" >> "$GITHUB_OUTPUT"
          echo "Promoting SHA=${full} → ${{ inputs.environment }}"

      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.sha }}"
          SHORT="${SHA:0:7}"
          echo "sha_short=${SHORT}" >> "$GITHUB_OUTPUT"

          PKG_VER=$(git show "${SHA}:frontend/planificador/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)
          BASE="$PKG_VER"
          if [ -n "${LATEST_TAG}" ]; then
            TAG_VER="${LATEST_TAG#v}"
            # Usar el mayor entre package.json y último tag
            HIGHER=$(printf '%s\n%s\n' "$PKG_VER" "$TAG_VER" | sort -V | tail -n1)
            BASE="$HIGHER"
          fi

          if [ "${{ inputs.environment }}" != "prod" ]; then
            echo "app_version=${BASE}" >> "$GITHUB_OUTPUT"
            echo "Version (no bump): ${BASE} (${SHORT})"
            exit 0
          fi

          EXISTING=$(git tag --points-at "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "${EXISTING}" ]; then
            NEW="${EXISTING#v}"
            echo "app_version=${NEW}" >> "$GITHUB_OUTPUT"
            echo "SHA already tagged ${EXISTING}; reuse ${NEW} (${SHORT})"
            exit 0
          fi

          IFS=. read -r MA MI PA <<< "$BASE"
          NEW="${MA}.${MI}.$((PA + 1))"
          TAG="v${NEW}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Release ${TAG}"
          git push origin "$TAG"

          git fetch origin main
          git checkout -B main origin/main
          node <<EOF
          const fs = require('fs');
          const path = 'frontend/planificador/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = '${NEW}';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          EOF
          if ! git diff --quiet -- frontend/planificador/package.json; then
            git add frontend/planificador/package.json
            git commit -m "chore: release ${TAG}"
            git push origin main
          fi

          echo "app_version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW} (${SHORT}), tagged ${TAG}"

  promote-api:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout at SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API for SHA
        uses: docker/build-push-action@v6
        with:
          context: backend/planificator
          file: backend/planificator/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          outputs: |
            type=image,name=${{ env.API_IMAGE }}:${{ env.TAG_PREFIX }}-${{ needs.setup.outputs.sha }},push=true,oci-mediatypes=false

      - name: Copy API manifest to AnepaVps
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ANEPAVPS_HOST }}
          username: ${{ secrets.ANEPAVPS_USER }}
          key: ${{ secrets.ANEPAVPS_SSH_KEY }}
          source: backend/planificator/planificator-api-${{ needs.setup.outputs.env_name }}.yaml
          target: /tmp/
          overwrite: true
          strip_components: 2

      - name: Deploy API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ANEPAVPS_HOST }}
          username: ${{ secrets.ANEPAVPS_USER }}
          key: ${{ secrets.ANEPAVPS_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            export KUBECONFIG="${HOME}/.kube/config"
            NS="${{ needs.setup.outputs.namespace }}"
            ENV_NAME="${{ needs.setup.outputs.env_name }}"
            SHA="${{ needs.setup.outputs.sha }}"
            IMG="${{ env.API_IMAGE }}:${{ env.TAG_PREFIX }}-${SHA}"

            kubectl apply -f "/tmp/planificator-api-${ENV_NAME}.yaml"

            kubectl -n "${NS}" set image \
              deployment/planificator-api-lara \
              "api=${IMG}"

            kubectl -n "${NS}" rollout status \
              deployment/planificator-api-lara \
              --timeout=300s

            kubectl -n "${NS}" get pods -l app=planificator-lara,tier=api -o wide
            echo "OK API promote ${IMG} → ${NS}"

  promote-web:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout at SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web for target env
        uses: docker/build-push-action@v6
        with:
          context: frontend/planificador
          file: frontend/planificador/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            VITE_BASE=${{ needs.setup.outputs.vite_base }}
            VITE_API_URL=${{ needs.setup.outputs.vite_api_url }}
            VITE_APP_ENV=${{ needs.setup.outputs.vite_app_env }}
            VITE_APP_VERSION=${{ needs.setup.outputs.app_version }}
            VITE_APP_GIT_SHA=${{ needs.setup.outputs.sha_short }}
          outputs: |
            type=image,name=${{ env.WEB_IMAGE }}:${{ env.TAG_PREFIX }}-${{ needs.setup.outputs.sha }}-${{ inputs.environment }},push=true,oci-mediatypes=false

      - name: Copy Web manifest to AnepaVps
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ANEPAVPS_HOST }}
          username: ${{ secrets.ANEPAVPS_USER }}
          key: ${{ secrets.ANEPAVPS_SSH_KEY }}
          source: frontend/planificador/planificator-web-${{ needs.setup.outputs.env_name }}.yaml
          target: /tmp/
          overwrite: true
          strip_components: 2

      - name: Deploy Web
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ANEPAVPS_HOST }}
          username: ${{ secrets.ANEPAVPS_USER }}
          key: ${{ secrets.ANEPAVPS_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            export KUBECONFIG="${HOME}/.kube/config"
            NS="${{ needs.setup.outputs.namespace }}"
            ENV_NAME="${{ needs.setup.outputs.env_name }}"
            SHA="${{ needs.setup.outputs.sha }}"
            ENV="${{ inputs.environment }}"
            IMG="${{ env.WEB_IMAGE }}:${{ env.TAG_PREFIX }}-${SHA}-${ENV}"

            kubectl apply -f "/tmp/planificator-web-${ENV_NAME}.yaml"

            kubectl -n "${NS}" set image \
              deployment/planificator-web-lara \
              "web=${IMG}"

            kubectl -n "${NS}" rollout status \
              deployment/planificator-web-lara \
              --timeout=300s

            kubectl -n "${NS}" get pods -l app=planificator-lara,tier=web -o wide
            echo "OK Web promote ${IMG} → ${NS}"
