# AnepaVps (k3s) — Postgres compartido dev/test (namespace dev)
# Deployment + Service DNS: postgres-dev-test
# Bases: planificator_db_dev (+ planificator_db_test para ns test)
# Usuario: planificator_app (Secret postgres)
# Nodo: anepapie1 (PV local /mnt/storage_a/postgres-dev-test)
# Aplicar: kubectl apply -f backend/planificator/postgres-dev.yaml
#
# Prerrequisito: Secret postgres en namespace dev
#   (ver postgres-dev.secret.example.yaml)
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pie1
  labels:
    app: postgres
    environment: anepapie1
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  volumeMode: Filesystem
  local:
    path: /mnt/storage_a/postgres-dev-test
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - anepapie1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pie1
  namespace: dev
  labels:
    app: postgres
    environment: anepapie1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  volumeName: postgres-data-pie1
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dev-test
  namespace: dev
  labels:
    app: postgres
    environment: anepapie1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
        environment: anepapie1
    spec:
      nodeSelector:
        kubernetes.io/hostname: anepapie1
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          env:
            # Override secret POSTGRES_DB so init + probes use the real app DB
            - name: POSTGRES_DB
              value: planificator_db_dev
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - planificator_app
                - -d
                - planificator_db_dev
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - planificator_app
                - -d
                - planificator_db_dev
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data-pie1
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-dev-test
  namespace: dev
  labels:
    app: postgres
    environment: anepapie1
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
      protocol: TCP
