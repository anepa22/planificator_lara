# Perfil dev — Active profiles = dev (mismo target AnepaVps que local)
# Útil si preferís el nombre "dev" en la Run Configuration.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:25432/planificator_db_dev}
    username: ${SPRING_DATASOURCE_USERNAME:planificator_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs

logging:
  level:
    ar.com.anepanet.planificator: DEBUG
