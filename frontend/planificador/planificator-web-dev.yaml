# AnepaVps (k3s) — Frontend Planificator Lara / TBD (convive con el stack viejo en ns dev)
# Namespace: dev · Image: ghcr.io/anepa22/planificator-web-lara:sha-<commit>
# URL: https://anepacloud.ddns.net/dev/planificator-lara
# Aplicar: kubectl apply -f frontend/planificador/planificator-web-dev.yaml
#
# No pisa planificator-web (viejo): nombres, path y labels distintos.
#
# Prerrequisitos:
#   - Secret ghcr-cred
#   - Service planificator-api-lara (nginx proxea /api)
#   - Imagen built con VITE_BASE=/dev/planificator-lara/ y VITE_API_URL=/dev/planificator-lara
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planificator-web-lara
  namespace: dev
  labels:
    app: planificator-lara
    tier: web
    environment: lara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planificator-lara
      tier: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: planificator-lara
        tier: web
        environment: lara
    spec:
      nodeSelector:
        kubernetes.io/hostname: anepapie1
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: web
          image: ghcr.io/anepa22/planificator-web-lara:sha-placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PLANIFICATOR_ENV
              value: production
            # nginx default.conf.template → proxy /api → http://${API_UPSTREAM}/api/
            - name: API_UPSTREAM
              value: planificator-api-lara:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: planificator-web-lara
  namespace: dev
  labels:
    app: planificator-lara
    tier: web
    environment: lara
spec:
  type: ClusterIP
  selector:
    app: planificator-lara
    tier: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Traefik: quita /dev/planificator-lara antes de llegar a nginx
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-planificator-web-lara
  namespace: dev
spec:
  stripPrefix:
    prefixes:
      - /dev/planificator-lara
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planificator-web-lara
  namespace: dev
  labels:
    app: planificator-lara
    tier: web
    environment: lara
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: dev-strip-planificator-web-lara@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - anepacloud.ddns.net
  rules:
    - host: anepacloud.ddns.net
      http:
        paths:
          - path: /dev/planificator-lara
            pathType: Prefix
            backend:
              service:
                name: planificator-web-lara
                port:
                  number: 80
