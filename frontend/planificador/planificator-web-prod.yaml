# AnepaVps (k3s) — Frontend Planificator Lara / TBD (namespace prod) — CUTOVER A
# Image: ghcr.io/anepa22/planificator-web-lara:sha-<commit>-prod
# URL oficial: https://lenceria-lara.ddns.net/  (mismo host que el stack viejo)
# Aplicar: kubectl apply -f frontend/planificador/planificator-web-prod.yaml
#
# Imagen built con VITE_BASE=/ y VITE_API_URL vacío (browser usa /api vía nginx).
#
# Cutover (una vez, a mano antes/durante el Promote a prod):
#   kubectl -n prod scale deploy/planificator-web --replicas=0
#   kubectl -n prod scale deploy/planificator-api --replicas=0
#   kubectl -n prod delete ingress planificator-web   # libera el host (rollback: re-apply YAML viejo)
# Rollback si falla:
#   kubectl -n prod scale deploy/planificator-web --replicas=1
#   kubectl -n prod scale deploy/planificator-api --replicas=1
#   # re-aplicar Ingress viejo del repo Planificator; scale Lara a 0 si hace falta
#   kubectl -n prod scale deploy/planificator-web-lara --replicas=0
#   kubectl -n prod scale deploy/planificator-api-lara --replicas=0
#
# Prerrequisitos: Secret ghcr-cred + Service planificator-api-lara en ns prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planificator-web-lara
  namespace: prod
  labels:
    app: planificator-lara
    tier: web
    environment: lara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planificator-lara
      tier: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: planificator-lara
        tier: web
        environment: lara
    spec:
      nodeSelector:
        kubernetes.io/hostname: anepavps
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: web
          image: ghcr.io/anepa22/planificator-web-lara:sha-placeholder-prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PLANIFICATOR_ENV
              value: production
            - name: API_UPSTREAM
              value: planificator-api-lara:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: planificator-web-lara
  namespace: prod
  labels:
    app: planificator-lara
    tier: web
    environment: lara
spec:
  type: ClusterIP
  selector:
    app: planificator-lara
    tier: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Sin Middleware stripPrefix: el host dedicado sirve en /
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planificator-web-lara
  namespace: prod
  labels:
    app: planificator-lara
    tier: web
    environment: lara
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lenceria-lara.ddns.net
  rules:
    - host: lenceria-lara.ddns.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planificator-web-lara
                port:
                  number: 80
